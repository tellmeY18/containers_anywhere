name: Prepare Containers Anywhere release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Containers Anywhere MVP build run
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/care-mvp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: python scripts/release.py --run-id "$BUILD_RUN_ID"
