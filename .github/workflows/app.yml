name: Build and accept app
on:
  workflow_dispatch:
    inputs:
      appliance_tag:
        description: Published recommendation for NEW clusters, e.g. appliance-v0.1.0
        type: string
        required: true
      runtime_tag:
        description: Optional independently selected runtime source (appliance-v or runtime-v tag)
        type: string
      e2e:
        description: Run the full end-to-end lifecycle against the published bytes. Off by default; run it before anything production-bound.
        type: boolean
        default: false
      extended:
        description: Also run the wider acceptance checks (implies e2e).
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve published dependencies once
        env:
          GH_TOKEN: ${{ github.token }}
          APPLIANCE_TAG: ${{ inputs.appliance_tag }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
        run: python3 scripts/components.py resolve --appliance-tag "$APPLIANCE_TAG" --runtime-tag "$RUNTIME_TAG" --output dependencies.json
      - id: version
        run: |
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from components import semver; from pathlib import Path; semver(Path("VERSION").read_text().strip())'
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependencies
          path: dependencies.json
          if-no-files-found: error
  amd64:
    needs: dependencies
    uses: ./.github/workflows/build-architecture.yml
    with:
      arch: amd64
      system: x86_64-linux
      runner: ubuntu-24.04
      packages: '{"include":[{"runner":"ubuntu-24.04","platform":"linux","arch":"amd64"},{"runner":"windows-2025","platform":"windows","arch":"amd64"}]}'
      version: ${{ needs.dependencies.outputs.version }}
      reuse_appliance: true
      e2e: ${{ inputs.e2e || inputs.extended }}
      extended: ${{ inputs.extended }}
  arm64:
    needs: dependencies
    uses: ./.github/workflows/build-architecture.yml
    with:
      arch: arm64
      system: aarch64-linux
      runner: ubuntu-24.04-arm
      packages: '{"include":[{"runner":"ubuntu-24.04-arm","platform":"linux","arch":"arm64"},{"runner":"macos-latest","platform":"macos","arch":"arm64"}]}'
      version: ${{ needs.dependencies.outputs.version }}
      reuse_appliance: true
      e2e: ${{ inputs.e2e || inputs.extended }}
      extended: ${{ inputs.extended }}
