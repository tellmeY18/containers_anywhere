name: Build and accept one architecture
on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      system:
        required: true
        type: string
      runner:
        required: true
        type: string
      packages:
        description: JSON include matrix of the desktop packages built for this architecture.
        required: true
        type: string
      version:
        required: true
        type: string
      appliance_version:
        type: string
        default: ''
      reuse_appliance:
        description: App builds download pinned published dependencies; never invoke Nix or stage QEMU.
        type: boolean
        default: false
      candidate_artifacts:
        description: CI-only reuse of this run's accepted artifacts; never release dependencies.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  appliance:
    if: ${{ !inputs.reuse_appliance }}
    name: appliance-${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: ca-nix-v3-${{ inputs.system }}-${{ hashFiles('APPLIANCE_VERSION', 'flake.nix', 'flake.lock', 'nix/**', 'cmd/guest/**', 'internal/guest/**', 'internal/boottls/**', 'internal/protocol/**', 'internal/publication/**', 'internal/atomicfile/**', 'go.mod', 'go.sum') }}
          restore-prefixes-first-match: |
            ca-nix-v3-${{ inputs.system }}-
            ca-nix-v2-${{ inputs.system }}-
            ca-nix-${{ inputs.system }}-
          gc-max-store-size-linux: 6000000000
      - name: Prove host-only edits do not change the guest derivation
        env:
          SYSTEM: ${{ inputs.system }}
        run: |
          before=$(nix eval --raw ".#packages.$SYSTEM.bundle.drvPath" --no-update-lock-file)
          cp main.go "$RUNNER_TEMP/host-input-main.go"
          printf '\n// Host-only input independence probe.\n' >> main.go
          after=$(nix eval --raw ".#packages.$SYSTEM.bundle.drvPath" --no-update-lock-file)
          mv "$RUNNER_TEMP/host-input-main.go" main.go
          test "$before" = "$after"
      - name: Build preloaded K3s and Kite appliance
        id: build
        env:
          SYSTEM: ${{ inputs.system }}
        run: |
          # Keep the current bundle rooted during cache-nix's post-job GC.
          bundle=$(nix build ".#packages.$SYSTEM.bundle" --no-update-lock-file --out-link result --print-out-paths)
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - name: Archive verified appliance
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
          ARCH: ${{ inputs.arch }}
        run: |
          mkdir -p dist
          python3 scripts/appliance.py "$BUNDLE" "dist/appliance-$ARCH.tar.gz"
      - name: Record guest closure and image sizes
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
          ARCH: ${{ inputs.arch }}
        run: |
          system=$(jq -r .system "$BUNDLE/manifest.json")
          nix path-info --recursive --json "$system" > "dist/closure-$ARCH.json"
          python3 scripts/appliance_report.py "$BUNDLE" "dist/appliance-$ARCH.tar.gz" "dist/closure-$ARCH.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Build distinct current-contract update drill appliance
        if: inputs.arch == 'amd64'
        run: |
          candidate=$(nix build .#packages.x86_64-linux.bundle-update-drill --no-update-lock-file --out-link result-update-drill --print-out-paths)
          python3 scripts/appliance.py "$candidate" dist/update-candidate-amd64.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.arch == 'amd64'
        with:
          name: update-candidate-amd64
          path: dist/update-candidate-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: closure-${{ inputs.arch }}
          path: dist/closure-*.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appliance-${{ inputs.arch }}
          path: dist/appliance-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  package:
    needs: appliance
    if: ${{ always() && !cancelled() && (needs.appliance.result == 'success' || (inputs.reuse_appliance && needs.appliance.result == 'skipped')) }}
    name: package-${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.packages) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: go vet ./... && go test -race ./...
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ !inputs.reuse_appliance }}
        with:
          name: appliance-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.reuse_appliance
        with:
          name: ${{ inputs.candidate_artifacts && 'candidate-dependencies' || 'dependencies' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.candidate_artifacts
        with:
          name: appliance-${{ matrix.arch }}
          path: dist/candidates
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: inputs.candidate_artifacts && matrix.platform != 'macos'
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/candidates
      - name: Download exact released appliance and runtime
        if: inputs.reuse_appliance
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CANDIDATE: ${{ inputs.candidate_artifacts }}
        run: |
          extra=()
          if [ "$CANDIDATE" = true ]; then extra+=(--candidate-dir dist/candidates); fi
          python scripts/components.py fetch --lock dependencies.json --platform "$PLATFORM" --arch "$ARCH" --output dist "${extra[@]}"
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools libfuse2t64
      - if: matrix.platform == 'linux' && !inputs.reuse_appliance
        env:
          QEMU_PACKAGE: ${{ matrix.arch == 'amd64' && 'qemu-system-x86' || 'qemu-system-arm' }}
        run: sudo apt-get install -y --no-install-recommends "$QEMU_PACKAGE" ipxe-qemu
      - name: Package launcher with independent component pins
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          APPLIANCE_VERSION: ${{ inputs.appliance_version }}
          REUSE: ${{ inputs.reuse_appliance }}
        run: |
          extra=()
          if [ "$REUSE" = true ]; then
            appliance_tag=$(python -c 'import json; print(json.load(open("dependencies.json"))["appliance"]["tag"])')
            runtime_tag=$(python -c 'import json; print(json.load(open("dependencies.json"))["runtime"]["tag"])')
            if [ "$PLATFORM" != macos ]; then
              extra+=(--runtime "dist/runtime-$PLATFORM-$ARCH.tar.gz")
            fi
          else
            appliance_tag="appliance-v$APPLIANCE_VERSION"
            runtime_tag="$appliance_tag"
          fi
          python scripts/package.py "$PLATFORM" --arch "$ARCH" --version "$VERSION" --appliance "dist/appliance-$ARCH.tar.gz" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$appliance_tag" \
            --runtime-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$runtime_tag" "${extra[@]}"
          if [ "$REUSE" = true ] && [ "$PLATFORM" != macos ]; then
            mkdir -p dist/acceptance/qemu
            tar -xzf "dist/runtime-$PLATFORM-$ARCH.tar.gz" -C dist/acceptance/qemu
          fi
      - name: Linux KVM boot, Kite workload, restart and encrypted restore
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        shell: bash
        env:
          PUBLIC_DEPENDENCIES: ${{ inputs.reuse_appliance && !inputs.candidate_artifacts }}
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          mkdir -p dist/acceptance/bundle dist/acceptance/qemu
          tar -xzf dist/appliance-amd64.tar.gz -C dist/acceptance/bundle
          if [ -f dist/releases/runtime-linux-amd64.tar.gz ]; then
            tar -xzf dist/releases/runtime-linux-amd64.tar.gz -C dist/acceptance/qemu
          fi
          runtime=dist/releases/runtime-linux-amd64.tar.gz
          if [ ! -f "$runtime" ]; then runtime=dist/runtime-linux-amd64.tar.gz; fi
          runtime_sha=$(sha256sum "$runtime" | cut -d ' ' -f1)
          appdir=dist/releases/stage-linux-amd64/containers-anywhere
          caddy_sha=$(sha256sum "$appdir/caddy" | cut -d ' ' -f1)
          go build -trimpath -ldflags="-X main.appVersion=replacement-test -X main.applianceURL=https://invalid.example/not-the-installed-appliance -X main.applianceSHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -X main.runtimeURL=https://invalid.example/qemu -X main.runtimeSHA256=$runtime_sha -X main.caddySHA256=$caddy_sha" -o "$appdir/replacement" .
          extra=()
          if [ "$PUBLIC_DEPENDENCIES" = true ]; then extra+=(--download); fi
          python scripts/smoke.py --binary "$appdir/containers-anywhere" --replacement-binary "$appdir/replacement" --runtime-archive "$runtime" --bundle dist/acceptance/bundle --state dist/smoke --restore --gateway "${extra[@]}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: matrix.platform == 'linux' && matrix.arch == 'amd64' && !inputs.reuse_appliance
        with:
          name: update-candidate-amd64
          path: dist
      - name: KVM explicit update, validation, restart and recovery export
        if: matrix.platform == 'linux' && matrix.arch == 'amd64' && !inputs.reuse_appliance
        run: |
          mkdir -p dist/update-candidate/bundle
          tar -xzf dist/update-candidate-amd64.tar.gz -C dist/update-candidate/bundle
          python scripts/smoke.py --binary dist/releases/stage-linux-amd64/containers-anywhere/containers-anywhere \
            --bundle dist/acceptance/bundle --state dist/smoke-update --gateway --update-bundle dist/update-candidate/bundle \
            --runtime-archive dist/releases/runtime-linux-amd64.tar.gz
      # Windows WHPX has no hosted runner, so replay its machine/CPU pair under
      # KVM. This checks the configuration WHPX depends on, not WHPX itself.
      - name: Linux KVM boot with the WHPX machine and CPU model
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        shell: bash
        env:
          CONTAINERS_QEMU_MACHINE: pc
        run: |
          python scripts/smoke.py --binary dist/releases/stage-linux-amd64/containers-anywhere/containers-anywhere --bundle dist/acceptance/bundle --state dist/smoke-whpx
      # No hosted runner has WHPX, so this replays the Windows VM under TCG.
      # The gateway path is deliberately not repeated here: Traefik, the demo
      # pod and TLS issuance all cost emulated CPU, and the network path itself
      # is platform-independent host code already covered by the Linux KVM step
      # above. Packaged caddy.exe is still validated by the Caddy step below,
      # which needs no VM. Pass --gateway once a WHPX runner exists.
      - name: Windows emulated VM boot and Kite acceptance
        # Disabled: TCG boot exceeds the readiness window on hosted runners.
        # Re-enable with a WHPX runner (matrix.platform == 'windows').
        if: false
        shell: bash
        env:
          CONTAINERS_QEMU_ACCEL: tcg
          CONTAINERS_GUEST_DEBUG: '1'
          CONTAINERS_SMOKE_BOOT_SECONDS: '2400'
        run: |
          mkdir -p dist/acceptance/bundle dist/acceptance/qemu
          tar -xzf dist/appliance-amd64.tar.gz -C dist/acceptance/bundle
          tar -xzf dist/releases/runtime-windows-amd64.tar.gz -C dist/acceptance/qemu
          python scripts/smoke.py --binary dist/releases/stage-windows-amd64/containers-anywhere/containers-anywhere.exe --bundle dist/acceptance/bundle --state dist/smoke
      - name: Validate generated configuration with packaged Caddy
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          export CONTAINERS_TEST_CADDY_CONFIG="$RUNNER_TEMP/caddy-config.json"
          go test -count=1 -run '^TestCaddyConfigHasNoPublicManagement$' .
          if [ "$PLATFORM" = macos ]; then
            helper="dist/releases/stage-macos-$ARCH/Containers Anywhere.app/Contents/MacOS/caddy"
          elif [ "$PLATFORM" = windows ]; then
            helper="dist/releases/stage-windows-$ARCH/containers-anywhere/caddy.exe"
          else
            helper="dist/releases/stage-linux-$ARCH/containers-anywhere/caddy"
          fi
          "$helper" validate --config "$CONTAINERS_TEST_CADDY_CONFIG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ inputs.candidate_artifacts && 'candidate-app-' || '' }}diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/smoke*/*.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.candidate_artifacts && 'candidate-app-' || '' }}package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/releases/Containers-Anywhere-*
            dist/releases/runtime-*.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.platform == 'windows'
        with:
          name: ${{ inputs.candidate_artifacts && 'candidate-app-' || '' }}acceptance-launcher-windows-amd64
          path: dist/releases/stage-windows-amd64/containers-anywhere/containers-anywhere.exe
          if-no-files-found: error
          retention-days: 14
