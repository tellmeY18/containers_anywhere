apiVersion: v1
kind: Namespace
metadata:
  name: containers-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: containers-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: containers-demo
  template:
    metadata:
      labels:
        app: containers-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: containers-anywhere/demo:@CADDY_VERSION@
          imagePullPolicy: Never
          ports:
            - name: web
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: web
          livenessProbe:
            httpGet:
              path: /
              port: web
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: containers-demo
spec:
  selector:
    app: containers-demo
  ports:
    - name: web
      port: 80
      targetPort: web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: containers-demo
spec:
  ingressClassName: containers-anywhere
  rules:
    - host: demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo
                port:
                  number: 80
    - host: demo.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo
                port:
                  number: 80
---
apiVersion: networking.containersanywhere.dev/v1alpha1
kind: WorkloadPublication
metadata:
  name: demo
  namespace: containers-demo
spec:
  ingressRef: demo
  hostname: demo.local
  lan: true
  mdns: true
  tls:
    mode: HTTP
---
apiVersion: networking.containersanywhere.dev/v1alpha1
kind: WorkloadPublication
metadata:
  name: demo-localhost
  namespace: containers-demo
spec:
  ingressRef: demo
  hostname: demo.localhost
  lan: false
  mdns: false
  tls:
    mode: HTTP
