# btrfs CSI driver for the data disk (github.com/mporrato/btrfs-csi, Unlicense), with the standard
# kubernetes-csi sidecars. Every PersistentVolumeClaim becomes a btrfs subvolume with a hard size limit
# (simple quotas), and VolumeSnapshots, clones and online expansion are standard Kubernetes APIs.
# The pool is the btrfs subvolume mounted at /var/lib/btrfs-csi/default by the appliance.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/component: csi-driver
    app.kubernetes.io/instance: btrfs-csi
    app.kubernetes.io/name: btrfs-csi-driver
    app.kubernetes.io/version: 0.1.0
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  name: btrfs-csi
---
