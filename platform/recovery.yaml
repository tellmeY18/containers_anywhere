# App-delivered API. Reconciled by the native host app over the authenticated
# guest channel; no image, Deployment, host token or workload grant is installed.
# Retain is essential: namespace deletion must not destroy recovery data.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: recovery-btrfs
driver: btrfs.csi.local
deletionPolicy: Retain
