# Unbound roles only. No workload obtains access by installing this manifest.
# Bind namespaced-requester with a RoleBinding after separately granting the
# recovery-workload service account the specific workload operations it needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: containers-recovery-namespaced-requester
rules:
  - apiGroups: [recovery.containersanywhere.dev]
    resources: [protectionpolicies, recoverypoints, restorerequests]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: containers-recovery-cluster-requester
rules:
  - apiGroups: [recovery.containersanywhere.dev]
    resources: [clusterprotectionpolicies, clusterrecoverypoints, clusterrestorerequests, backupdestinations]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: containers-recovery-observer
rules:
  - apiGroups: [recovery.containersanywhere.dev]
    resources: [protectionpolicies, recoverypoints, restorerequests, clusterprotectionpolicies, clusterrecoverypoints, clusterrestorerequests, backupdestinations]
